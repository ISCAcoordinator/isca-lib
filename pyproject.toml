[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isca-lib"
version = "0.0.1"
description = "The core ISCA library"
readme = {file="README.md", content-type = "text/markdown"}
authors = [
   {name="Sébastien Le Maguer", email="sebastien.lemaguer@helsinki.fi"}
]
license = {text = "LicenseRef-Proprietary"}
keywords = []
requires-python = ">=3.11"
classifiers = [
]
dependencies = [
  "openpyxl>=3.1.5",
  "pymupdf>=1.25.5",
  "pandas>=2.3.0",
  "ruamel.yaml>=0.18.13",
  "unidecode>=1.4.0",
  "typing_extensions>=4.15.0",
  "pymupdf>=1.26.6"
]
[project.optional-dependencies]
dev = [
  "pre-commit",
  "black",
  "basedpyright",
  "pytest",
  "debugpy"
]
[project.urls]
Homepage = "https://github.com/ISCACoordinator/isca"
Issues = "https://github.com/ISCACoordinator/isca/issues"
git = "https://github.com/ISCACoordinator/isca.git"

[tool.black]
line-length = 130

[tool.isort]
profile = "black"
line_length = 130

[tool.flake8]
max-line-length = 130
extend-ignore = "E203, W503"

[tool.mypy]
python_version = 3.11
warn_return_any = true
warn_unused_configs = true
disallow_untyped_calls = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pre_commit]
version = "2.15.0"
hooks = ["black", "isort", "flake8"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
