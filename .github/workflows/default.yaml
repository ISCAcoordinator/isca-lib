name: validate ISCA lib
run-name: ${{ github.actor }} is in process

on:
  push:
    paths:
      - src/**

  pull_request:
    types:
      - ready_for_review

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11' ]

    steps:
      # Setup python
      - name: Setup python
        uses: actions/setup-python@v1
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      # Install everything
      - name: Install the toolkit
        run: pip install -e .[dev]

      - name: Unit Tests
        run: |
          pytest -s tests
